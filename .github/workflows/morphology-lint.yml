name: Morphology Lint Reports

on:
  push:
    paths:
      - 'out/*.tsv'
      - 'reports/**'
      - 'linter/**'
      - 'lint_reports/**'
      - 'scripts/generate_lint_reports.py'
      - 'scripts/parse_lint_reports.py'
      - '.githooks/pre-commit'
      - '.github/workflows/morphology-lint.yml'
  pull_request:
    paths:
      - 'out/*.tsv'
      - 'reports/**'
      - 'linter/**'
      - 'lint_reports/**'
      - 'scripts/generate_lint_reports.py'
      - 'scripts/parse_lint_reports.py'
      - '.githooks/pre-commit'
      - '.github/workflows/morphology-lint.yml'
  workflow_dispatch:

jobs:
  parse_reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse committed lint reports
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/parse_lint_reports.py

      - name: Upload committed reports
        uses: actions/upload-artifact@v4
        with:
          name: morphology-lint-reports
          path: |
            reports/lint_report.txt
            reports/lint_stderr.txt
            reports/lint_summary.md
            reports/lint_stats.json
            reports/lint_history.json
            reports/lint_trends.md
            reports/lint_severity_trend.svg
            reports/lint_issue_types_trend.svg
